<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050505;
  --bg-glow: #0e0505;
  --surface: #0b0b0b;
  --edge: #232323;
  --edge-soft: #1a1a1a;
  --accent: #c9302c;
  --text: #ececeb;
  --muted: #7d7d7d;
  --font-display: 'Bebas Neue', -apple-system, sans-serif;
  --font-body: 'Inter', -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  min-height: 100%;
  background:
    radial-gradient(900px 500px at 50% 0%, var(--bg-glow), transparent 70%),
    var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  padding: 56px 20px 64px;
  padding-top: calc(56px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
}

header {
  text-align: center;
  max-width: 900px;
  margin: 0 auto 48px;
}

h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(40px, 8vw, 72px);
  letter-spacing: 3px;
  margin: 0;
  line-height: 1;
  position: relative;
  display: inline-block;
  background: linear-gradient(
    110deg,
    #3a3a3a 0%, #8a8a8a 12%, #f4f4f4 22%, #ffffff 26%, #8a8a8a 34%, #2a2a2a 46%,
    #3a3a3a 60%, #8a8a8a 72%, #f4f4f4 82%, #ffffff 86%, #8a8a8a 94%, #2a2a2a 100%
  );
  background-size: 260% 100%;
  background-position: 0% 0%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4));
  animation: shine 6s linear infinite;
}
@keyframes shine {
  0%   { background-position: 0% 0%; }
  100% { background-position: -260% 0%; }
}
@media (prefers-reduced-motion: reduce) {
  h1 { animation: none; background-position: 30% 0%; }
}

header .rule {
  width: 64px;
  height: 3px;
  margin: 18px auto 0;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  border-radius: 3px;
  box-shadow: 0 0 12px 1px rgba(201,48,44,0.55);
}

.gallery {
  max-width: 1080px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 22px;
}
@media (max-width: 680px) {
  .gallery { grid-template-columns: 1fr; }
}

.frame {
  position: relative;
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--edge);
  cursor: pointer;
  transition: transform 0.35s cubic-bezier(.2,.8,.2,1), border-color 0.35s ease, box-shadow 0.35s ease;
  will-change: transform;
}
.frame::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.35) 100%);
  opacity: 0;
  transition: opacity 0.35s ease;
  pointer-events: none;
}
.frame:hover {
  transform: translateY(-6px) scale(1.015);
  border-color: #3a3a3a;
  box-shadow: 0 18px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02) inset;
}
.frame:hover::after { opacity: 1; }
.frame img {
  width: 100%;
  height: auto;
  display: block;
  transition: transform 0.5s cubic-bezier(.2,.8,.2,1), filter 0.35s ease;
  filter: saturate(0.96) contrast(1.02);
}
.frame:hover img {
  transform: scale(1.05);
}

.empty-msg {
  text-align: center;
  color: var(--muted);
  margin-top: 40px;
  font-size: 15px;
}

/* Lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(3,3,3,0.88);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  padding: 24px;
  padding-top: calc(24px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}
.lightbox.open { opacity: 1; visibility: visible; }
.lightbox img {
  max-width: 100%;
  max-height: 100%;
  border-radius: 8px;
  box-shadow: 0 20px 80px rgba(0,0,0,0.7);
  transform: scale(0.94);
  transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
}
.lightbox.open img { transform: scale(1); }
.lightbox .close {
  position: absolute;
  top: calc(20px + env(safe-area-inset-top, 0px));
  right: 24px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  color: var(--text);
  font-size: 22px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--edge);
  cursor: pointer;
  transition: background 0.2s ease, transform 0.2s ease;
}
.lightbox .close:hover {
  background: rgba(255,255,255,0.12);
  transform: rotate(90deg);
}
</style>
</head>
<body>

<!--
  HOW TO USE
  ==========
  1. Put this account's screenshots in the "images" folder next to this file.
     Any number of images works.
  2. Change the title text below.
  3. List your actual image filenames in the "images" array further down.
  4. To make a new account page: copy this whole folder, rename it, swap
     the images, and update the title + list.
-->

<header>
  <h1>VALORANT ACCOUNT SHOWCASE</h1>
  <div class="rule"></div>
</header>

<div class="gallery" id="gallery"></div>
<p class="empty-msg" id="empty-msg" style="display:none;">No images added yet.</p>

<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="close" onclick="closeLightbox(event)">&times;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script>
// ===== IMAGE LIST =====
// Add or remove filenames here — must match files inside the "images" folder.
const images = [
  "images/1.jpg",
  "images/2.jpg",
  
  
];
// =======================

const gallery = document.getElementById('gallery');
if (images.length === 0) {
  document.getElementById('empty-msg').style.display = 'block';
} else {
  images.forEach(src => {
    const frame = document.createElement('div');
    frame.className = 'frame';
    const img = document.createElement('img');
    img.src = src;
    img.alt = 'screenshot';
    img.loading = 'lazy';
    frame.appendChild(img);
    frame.addEventListener('click', () => openLightbox(src));
    gallery.appendChild(frame);
  });
}

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(e) {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
});
</script>

</body>
</html>
